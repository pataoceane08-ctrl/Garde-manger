<title>Inventaire Garde-manger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&family=Karla:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Aquarelle potagère : papier crème, touches de vert feuille, tomate, safran et cuivre. Un seul thème clair, chaleureux. */
:root{
  --bg:#f6efdc; --surf:#fcf9ee; --surf2:#efe6cb; --line:#d9cca4;
  --fg:#2b2a1e; --mut:#6c6a52; --acc:#4d8a43; --accfg:#ffffff; --copper:#c26a2e;
  --ok:#d9ebbf; --buy:#f5bdb2; --no:#ebe5d0; --low:#f7e49a; --warn:#9a6a00;
  --viol:#8b6cc7; --blue:#3f86bd; --orange:#d9772c; --pink:#d2588f; --tom:#d8553f;
  --k1:#6fae5a; --k2:#d8553f; --k3:#4f93c4; --k4:#e0a02f; --k5:#8b6cc7; --k6:#c26a2e; --k7:#3fa391; --k8:#d2588f;
  --head:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hand:'Caveat','Segoe Print',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px;letter-spacing:.01em}
h2{font-size:26px}
h3{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 0;border-bottom:3px double var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:6px}
.brand small{color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px 8px;white-space:nowrap;font-family:var(--head);font-size:19px;font-weight:600;color:var(--mut);margin-bottom:-1px}
.nav button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--copper)}
.nav button .car{font-size:11px;margin-left:4px;opacity:.7}
.pop{position:fixed;z-index:40;min-width:200px;max-width:calc(100vw - 24px);background:var(--surf);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:6px;display:flex;flex-direction:column}
.pop button{text-align:left;background:none;border:0;padding:9px 10px;border-radius:4px;display:flex;justify-content:space-between;gap:16px}
.pop button:hover,.pop button[aria-current="true"]{background:var(--surf2)}
.pop .n{color:var(--mut);font-variant-numeric:tabular-nums}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
main{padding-block:18px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.mut{color:var(--mut)}
.small{font-size:13px}
.btn{background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:8px 13px;min-height:38px}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
.btn.dng{border-color:var(--no)}
.in{background:var(--surf);border:1px solid var(--line);border-radius:5px;padding:7px 9px;min-height:36px;min-width:0;width:100%}
.in.num{width:78px;text-align:right;font-variant-numeric:tabular-nums}
.in.tx{background:transparent;border-color:transparent}
.in.tx:hover,.in.tx:focus{background:var(--surf);border-color:var(--line)}
textarea.in{min-height:96px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.card.hl{border-color:var(--copper)}
.big{font-family:var(--head);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mut)}
.pill.w{color:var(--warn);border-color:var(--warn)}
.budget{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-block:12px}
.budget>div{background:var(--surf);padding:8px 12px;min-width:0}
.budget span{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.budget b{font-family:var(--head);font-size:24px;font-variant-numeric:tabular-nums}
.budget input{border:0;background:transparent;font-family:var(--head);font-size:24px;font-weight:700;width:100%;padding:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:1180px}
th{font-family:var(--head);font-size:17px;text-align:left;padding:8px 8px;background:var(--surf2);border-bottom:1px solid var(--line);white-space:nowrap}
th.c-buy{color:var(--warn)}th.c-no{color:#e0746d}th.c-ok{color:var(--acc)}
td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.ck,th.ck{text-align:center}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
tr.r-ok td{background:var(--ok)}
tr.r-buy td{background:var(--buy)}
tr.r-no td{background:var(--no)}
tr.t-viol td:first-child{box-shadow:inset 5px 0 var(--viol)}
tr.t-blue td:first-child{box-shadow:inset 5px 0 var(--blue)}
tr.t-orange td:first-child{box-shadow:inset 5px 0 var(--orange)}
tr.t-pink td:first-child{box-shadow:inset 5px 0 var(--pink)}
tr.grp td{background:var(--surf2);font-family:var(--head);font-size:17px;font-weight:600;padding:5px 10px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:none;padding:0}
.dot.viol{background:var(--viol)}.dot.blue{background:var(--blue)}.dot.orange{background:var(--orange)}.dot.pink{background:var(--pink)}
.ent{font-size:11px;border:1px solid var(--line);background:transparent;border-radius:99px;padding:0 7px;color:var(--mut);min-height:22px}
.ent.on{color:var(--warn);border-color:var(--warn)}
.cardrow{display:grid;gap:8px;padding:12px;border-radius:8px;border:1px solid var(--line);grid-template-columns:1fr 1fr}
.cardrow.r-ok{background:var(--ok)}.cardrow.r-buy{background:var(--buy)}.cardrow.r-no{background:var(--no)}
.cardrow .full{grid-column:1/-1}
.cards{display:grid;gap:10px;margin-top:10px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.dlc-soon{color:var(--warn);font-weight:700}.dlc-over{color:#e0746d;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-width:38px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--surf)}
.seg button[aria-pressed="true"]{background:var(--copper);color:#1a1409;border-color:var(--copper);font-weight:700}
.bar{height:14px;background:var(--surf2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
.bar.over>i{background:#d4645b}
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ing{display:flex;gap:10px;align-items:baseline}
.ing .q{min-width:74px;text-align:right;font-variant-numeric:tabular-nums;color:var(--copper);font-weight:700}
.ing .m{margin-left:auto;font-size:12px}
.ok{color:var(--acc)}.ko{color:#e0746d}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px 18px;text-align:center;color:var(--mut)}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:90;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.lev-e{border-left:3px solid var(--copper);padding:4px 0 4px 12px}
.menu td{vertical-align:top}
.menu select{min-width:0}
@media (max-width:640px){h1{font-size:26px}.budget b,.budget input{font-size:20px}.cardrow{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}
body{background:var(--bg);background-image:radial-gradient(60vw 40vh at 8% -5%,rgba(111,174,90,.22),transparent 70%),radial-gradient(50vw 36vh at 100% 0%,rgba(224,160,47,.20),transparent 70%),radial-gradient(60vw 50vh at 50% 110%,rgba(216,85,63,.10),transparent 70%);background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,#f6efdc 70%,rgba(246,239,220,.92));padding-block:10px 0;border-bottom:2px solid var(--line);box-shadow:0 6px 0 -3px rgba(111,174,90,.35)}

const SOUS=Object.fromEntries(Object.entries(SUBRULES).map(([k,v])=>[k,v.t]));
const itemCat=i=>CAT[i.stock]?i.stock:(LEG[i.stock]?LEG[i.stock][0]:'autres');
const subOf=i=>{const k=itemCat(i);if(!SOUS[k])return'';if(SOUS[k].includes(i.cat))return i.cat;return (LEG[i.stock]&&LEG[i.stock][1])||''};
const guessSub=(it,k)=>{k=k||itemCat(it);const S0=SUBRULES[k];if(!S0)return'';const n=norm(it.nom);for(const[re,t]of S0.r)if(re.test(n))return t;return S0.d||''};
let migSeen=new Set();
function autoMig(){
  if(!db)return;
  S.stock.forEach(it=>{
    let ch=false;
    if(LEG[it.stock]){const[k,t]=LEG[it.stock];it.stock=k;it.cat=guessSub(it,k)||t;ch=true}
    if(it.stock==='laitages'&&(it.cat==='Yaourts & desserts'||(!SOUS.laitages.includes(it.cat)&&/yaourt|skyr|fromage blanc|petits suisses|faisselle|brasse|riz au lait/.test(norm(it.nom))))){it.stock='dessert';it.cat='Crèmes & laitages';ch=true}
    const k=itemCat(it);
    if(SOUS[k]&&!SOUS[k].includes(it.cat)){const g=guessSub(it,k);if(g){it.cat=g;ch=true}}
    if(ch){const key=it.id+':'+it.stock+':'+it.cat;if(!migSeen.has(key)){migSeen.add(key);save('stock',it)}}
  });
}

/* ---------- quantités et recettes ---------- */
function frac(n){
  const w0=Math.floor(n+1e-9),r=n-w0,F=[[0,''],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
  let b=F[0],bd=9; for(const f of F){const d=Math.abs(r-f[0]);if(d<bd){bd=d;b=f}}
  if(bd>0.06)return String(Math.round(n*10)/10).replace('.',',');
  const W=w0+(b[0]===1?1:0); return (W?String(W):'')+b[1]||'0';
}
function fmtQty(q,u){ if(q==null||q==='')return ''; u=u||''; if(u==='g'&&q>=1000){q/=1000;u='kg'} if(u==='ml'&&q>=1000){q/=1000;u='l'} return frac(q)+(u?' '+u:''); }
function parseQty(s){
  s=String(s).trim(); const map={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};
  let t=0,m;
  if((m=s.match(/^(\d+)\s*\/\s*(\d+)$/)))return +m[1]/+m[2];
  const last=s.slice(-1); if(map[last]!=null){t=map[last];s=s.slice(0,-1).trim()}
  return (s?num(s):0)+t;
}
function parseIng(line){
  line=line.trim(); if(!line)return null;
  const m=line.match(/^(\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?\s*[½¼¾⅓⅔]?|[½¼¾⅓⅔])\s*(?:(kg|g|cl|ml|l|c\.?\s*à\s*(?:café|soupe)|cac|cas|pincées?|poignées?|branches?|filets?|gousses?)(?=\s|$))?\s*(?:de |d'|d’)?(.+)$/i);
  if(!m)return{nom:line,qte:null,unite:''};
  return{qte:parseQty(m[1]),unite:(m[2]||'').toLowerCase().replace(/\s+/g,' '),nom:m[3].trim()};
}
const ingLine=i=>(i.qte!=null&&i.qte!==''?fmtQty(i.qte,i.unite)+' ':'')+(i.unite&&i.qte!=null?'de ':'')+i.nom;
function findStock(nom){
  const toks=norm(nom).split(/[^a-z]+/).filter(t=>t.length>=4); if(!toks.length)return null;
  let best=null,bs=0;
  S.stock.forEach(it=>{const n=norm(it.nom);const sc=toks.filter(t=>n.includes(t.replace(/s$/,''))).length;if(sc>bs){bs=sc;best=it}});
  return best;
}

/* ---------- règles du stock ---------- */
function stockSet(it,f,v){
  const prev=+it.qte||0; it[f]=v;
  if(f==='qte'){
    if(v<=0){it.aAcheter=true;it.enStock=false;if(+it.obj>0)it.aqte=Math.max(1,Math.ceil(it.obj))}
    else if(prev<=0){it.aAcheter=false;it.enStock=true}
    if(v>0&&v<prev&&+it.obj>0&&v<it.obj&&!it.aAcheter){it.aAcheter=true;it.aqte=Math.max(1,Math.ceil(it.obj-v));it.aqteS=0}}
  if(f==='enStock'){if(!v){it.qte=0;it.aAcheter=true}else if(!(+it.qte>0)){it.qte=1;it.aAcheter=false}}
  save('stock',it);
  if(f==='qte'&&v<prev)planAuto(it);
}

const newItem=o=>Object.assign({id:uid(),nom:'',stock:'autres',cat:'',unite:'pièce',qte:0,obj:0,surgele:false,entame:false,prix:0,enStock:true,aAcheter:false,mange:false,aqte:1,dlc:'',bcat:'Alimentaire',note:'',ordre:S.stock.length},o);
function buyDone(id,q,prix,dlc,bcat){
  const it=S.stock.find(x=>x.id===id); if(!it)return;
  const sP=Math.min(q,Math.max(0,+it.aqteS||0));it.qteS=(+it.qteS||0)+sP;it.aqteS=0;
  it.qte=(+it.qte||0)+q-sP; it.prix=prix; it.enStock=true; it.aAcheter=false; it.entame=false; if(dlc)it.dlc=dlc; it.bcat=bcat; save('stock',it);
  const t=todayISO(); save('achats',{id:uid(),date:t,mois:t.slice(0,7),semaine:weekOf(t),produit:it.nom,bcat,montant:+(q*prix).toFixed(2),qte:q});
  toast(it.nom+' est en stock');
}

function vStock(){

  if(sub==='jauges')return vJaugesQuot();

  const base=S.stock.filter(i=>(!ui.q||norm(i.nom).includes(norm(ui.q)))&&passF(i));
  let secs='',title='Toute la réserve',tiles='';
  if(sub==='dlc'){
    title='À consommer d’abord';
    const L=base.filter(i=>i.dlc&&+i.qte>0).sort((a,b)=>a.dlc.localeCompare(b.dlc));
    secs=L.length?secHtml('dlc','Par date de péremption','⏳',4,L,vue):empty('Aucune date saisie pour l’instant. Remplis la colonne DLC dans le stock ou au moment de cocher « acheté ».');
  } else if(sub==='tout'){
    secs=CATDEF.map(c=>[c,base.filter(i=>itemCat(i)===c[0])]).filter(([c,L])=>L.length).map(([c,L])=>secHtml(c[0],c[1],c[2],c[3],L,vue)).join('')||empty(S.stock.length?'Aucun produit ne correspond.':'Ton stock est vide. Ouvre le catalogue de départ pour le remplir en quelques clics.',`<button class="btn pri" data-act="nav-go" data-m="stock" data-s="catalogue">Ouvrir le catalogue</button>`);

    const L=ui.typ?all.filter(i=>(subOf(i)||'Autres')===ui.typ):all;
    secs=secHtml(c[0],c[1],c[2],c[3],L,vue);

  return `<div class="row sp"><h2>${esc(title)}</h2><span class="mut small">${S.stock.length} produits</span></div>

function tileCard(a){

function vReserve(){

/* Budget */

  return `<h2>Budget</h2>${nav}

}

/* Recettes */

  if(sub==='import')return vImport();
  if(ui.rec){const r=S.recettes.find(x=>x.id===ui.rec); if(r)return ui.edit?vRecForm(ui.draft||(ui.draft=JSON.parse(JSON.stringify(r)))):vRecDetail(r); ui.rec=null}
  const L=S.recettes.filter(r=>!ui.rq||norm(r.titre+' '+(r.ings||[]).map(i=>i.nom).join(' ')).includes(norm(ui.rq))).sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||a.titre.localeCompare(b.titre,'fr'));

}

function levDue(l){const f=lastFeed(l);if(!f)return null;const d=new Date(f.quand);d.setDate(d.getDate()+(+l.freq||7));return Math.ceil((d-new Date())/864e5)}

   <label class="f">Nourrir tous les (jours)<input class="in" type="number" min="1" value="${l.freq||7}" data-c="levains" data-id="${l.id}" data-f="freq"></label></div>

   <label class="f">Odeur<select class="in" id="jo"><option value="">—</option><option>neutre</option><option>acidulée</option><option>vinaigre</option><option>acétone</option><option>fruitée</option></select></label></div>
   <label class="f">Notes<input class="in" id="jn"></label><div class="row"><button class="btn pri">Ajouter au journal</button></div></form>

    return `<div class="modalbg" data-act="closemodal"><div class="modal" role="dialog" aria-label="Acheté"><h3>${esc(it.nom)}</h3>

    return `<div class="modalbg" data-act="closemodal"><div class="modal" role="dialog" aria-label="Déplacer"><h3>${esc(it.nom)}</h3><b class="small">Rayon</b><div class="chips">${CATDEF.map(c=>`<button class="chip" data-act="setrayon" data-id="${it.id}" data-k="${c[0]}" aria-pressed="${c[0]===k}">${c[2]} ${esc(c[1])}</button>`).join('')}</div>${SOUS[k]?`<b class="small">Type</b><div class="chips">${SOUS[k].map(t=>`<button class="chip" data-act="setsous" data-id="${it.id}" data-v="${esc(t)}" aria-pressed="${t===subOf(it)}">${esc(t)}</button>`).join('')}</div>`:''}<div class="row"><button class="btn pri" data-act="closemodal">OK</button></div></div></div>`}
  if(m.t==='meal'){

  if(e.dataset.actChange==='kitctrl'){const x=kitW().find(y=>y.id===e.dataset.id);if(x){x.ctrl=e.value;w('config/main',S.config)}return}

  const o=S[c].find(x=>x.id===e.dataset.id); if(!o)return; const f=e.dataset.f;
  let v=e.type==='checkbox'?e.checked:e.type==='number'?num(e.value):e.value;

    if(!S.config.catx.some(e=>e.stock===k&&norm(e.nom)===norm(n))){S.config.catx.push({nom:n,stock:k,unite:CAT[k].u});w('config/main',S.config)}
    catxMerge();
    if(!ex){const it=newItem({nom:n,stock:k,unite:CAT[k].u,qte:1});S.stock.push(it);save('stock',it)}
    ui.open['c_'+k]=true;render();toast(n+' ajouté dans '+CAT[k].l);return}
  if(f==='addstock'){const n=g('ns').trim();if(!n)return;const k=g('nc')||'autres';const it=newItem({nom:n,stock:k,unite:CAT[k].u,qte:1});S.stock.push(it);save('stock',it);render();toast(n+' ajouté')}
  if(f==='addcourse'){const n=g('cn').trim();if(!n)return;const ex=S.stock.find(i=>norm(i.nom)===norm(n));if(ex){ex.aAcheter=true;save('stock',ex)}else{const k=g('cs')||'autres';const it=newItem({nom:n,stock:k,unite:CAT[k].u,qte:0,enStock:false,aAcheter:true});S.stock.push(it);save('stock',it)}render()}
  if(f==='addeau'){const n=g('en').trim(),o=num(g('eo'));if(!n||!o)return;eauW().push({id:uid(),nom:n,u:g('eu')||'pièces',obj:o,have:0});w('config/main',S.config);render();toast('Ligne ajoutée');return}
  if(f==='addkit'){const n=g('kn').trim();if(!n)return;kitW().push({id:uid(),sac:ui.sac,nom:n,ok:false,ctrl:''});w('config/main',S.config);render();return}
  if(f==='addobj'){const n=g('on').trim(),o=Math.round(num(g('oq')));if(!n||!o)return;let it=S.stock.find(i=>norm(i.nom)===norm(n))||S.stock.find(i=>norm(i.nom).startsWith(norm(n)));if(it){it.obj=o;save('stock',it)}else{it=newItem({nom:n,stock:'autres',unite:g('ou'),qte:0,obj:o,enStock:false});S.stock.push(it);save('stock',it)}render();toast('Objectif enregistré')}
  if(f==='adddep'){const m=num(g('dm'));if(!g('dl').trim()||!m)return;const cur=curMonth(),mm=ui.month||cur,t=mm===cur?todayISO():mm+'-01';save('achats',{id:uid(),date:t,mois:mm,semaine:weekOf(t),produit:g('dl').trim(),bcat:g('dc'),montant:m,qte:1,prevu:mm>cur});render()}
  if(f==='saverec'){
    const d=ui.draft||{type:'recette'};
    Object.assign(d,{titre:g('rt').trim(),cat:g('rc'),diff:g('rd'),portions:+g('rp')||4,prep:num(g('rpm')),cuis:num(g('rcm')),ings:g('ri').split('\n').map(parseIng).filter(Boolean),etapes:g('re').split('\n').map(s=>s.trim()).filter(Boolean),notes:g('rn'),source:g('rs')});
    if(!d.type)d.type='recette'; if(!d.id){d.id=uid();S.recettes.push(d)}else{const i=S.recettes.findIndex(x=>x.id===d.id);if(i>=0)S.recettes[i]=d}
    save('recettes',d);ui.rec=d.id;ui.edit=false;ui.draft=null;ui.people=null;if(ui.sub!=='biblio')ui.sub='biblio';saveNav();render();toast('Recette enregistrée')}
  if(f==='vif'){const d={id:uid(),titre:g('vn').trim(),type:'repas',cat:'Plat',portions:4,ings:g('vi').split('\n').map(parseIng).filter(Boolean),etapes:[],notes:'Noté sur le vif le '+todayISO(),source:'',fav:false};S.recettes.push(d);save('recettes',d);ui.rec=d.id;ui.sub='biblio';saveNav();render();toast('Repas gardé')}
  if(f==='addimport'){const t=g('il').trim();if(!t)return;const x={id:uid(),texte:t,date:todayISO()};S.imports.push(x);save('imports',x);render();toast('Ajouté à la boîte')}
  if(f==='newlev'){const l={id:uid(),nom:g('ln').trim(),ne:todayISO(),hydra:100,freq:7,farine:'',notes:''};S.levains.push(l);save('levains',l);go('levain',l.id)}
  if(f==='journal'){const l=ev.target.dataset.lev;const j={id:uid(),levain:l,type:g('jt'),quand:g('jq')||new Date().toISOString().slice(0,16),farine:num(g('jf')),eau:num(g('je')),garde:num(g('jp')),montee:g('jm'),odeur:g('jo'),notes:g('jn')};S.journal.push(j);save('journal',j);render();toast('Ajouté au journal')}
});

/* ---------- actions métier ---------- */
function addMissing(r){
  const p=recScale(r),f=p/(r.portions||4);let n=0;
  (r.ings||[]).forEach(i=>{const it=findStock(i.nom);if(!it||!(it.qte>0)||it.mange){sendToCourses(i.nom);n++}});
  toast(n?n+' produit'+(n>1?'s':'')+' ajouté'+(n>1?'s':'')+' aux courses':'Tout est déjà en stock');render();
}
function menuCourses(){
  const need={};
  Object.values(S.menus.slots||{}).forEach(s=>{const r=S.recettes.find(x=>x.id===s.r);if(!r)return;const f=(s.p||4)/(r.portions||4);(r.ings||[]).forEach(i=>{need[norm(i.nom)]=i.nom})});
  let n=0;Object.values(need).forEach(nom=>{const it=findStock(nom);if(!it||!(it.qte>0)||it.mange){sendToCourses(nom);n++}});
  toast(n?n+' produit'+(n>1?'s':'')+' ajouté'+(n>1?'s':'')+' à la liste de courses':'Le stock couvre déjà tout le menu');
}
async function doStructure(text,impId){
  if(!text||text.trim().length<20){toast('Colle d’abord un texte de recette');return}
  const info=$('#sinfo'),b=$('#bstruct'); if(info)info.textContent='Lecture en cours…'; if(b)b.disabled=true; else toast('Lecture en cours…');
  try{
    const sample=await window.claude.use('sample'); if(!sample)throw new Error('x');
    const r=await sample.json('Tu transformes un texte de recette en JSON strict, sans aucun autre texte. Schéma : {"titre":string,"cat":"Entrée|Plat|Dessert|Pain & levain|Sauce|Boisson|Goûter|Autre","diff":"Facile|Moyen|Difficile","portions":nombre entier de 1 à 12,"prep":minutes,"cuis":minutes,"ingredients":[{"qte":nombre ou null,"unite":"g|kg|ml|cl|l|c. à café|c. à soupe|pincée|poignée|","nom":string}],"etapes":[string],"notes":string}. Garde le français. N\'invente aucun ingrédient absent du texte. Texte :\n'+text.slice(0,6000),{cache:false});
    const d={id:uid(),type:'recette',titre:r.titre||'Recette sans titre',cat:r.cat||'Plat',diff:r.diff||'Facile',portions:Math.min(12,Math.max(1,+r.portions||4)),prep:+r.prep||0,cuis:+r.cuis||0,ings:(r.ingredients||[]).map(i=>({qte:i.qte==null?null:+i.qte,unite:i.unite||'',nom:i.nom})),etapes:r.etapes||[],notes:r.notes||'',source:impId?'Boîte « À importer »':'Texte collé'};
    S.recettes.push(d);save('recettes',d);if(impId)del('imports',impId);ui.rec=d.id;ui.sub='biblio';ui.edit=true;ui.draft=JSON.parse(JSON.stringify(d));saveNav();render();toast('Relis la recette avant de l’enregistrer');
  }catch(e){if(info)info.textContent='';if(b)b.disabled=false;toast(e&&e.code==='not_granted'?'Autorisation refusée.':'Je n’ai pas pu lire ce texte. Réessaie ou saisis la recette à la main.')}
}

/* ---------- exports ---------- */

function buildFiles(){
  const F={},cur=curMonth();
  let md='---\ntags: [cuisine, stock]\nmaj: '+todayISO()+'\n---\n# Stock\n';
  CATDEF.forEach(([k,l])=>{const L=S.stock.filter(i=>itemCat(i)===k);if(!L.length)return;md+=`\n## ${l}\n\n| Produit | Qté | Unité | Objectif | DLC | État |\n|---|---|---|---|---|---|\n`+L.sort((a,b)=>a.nom.localeCompare(b.nom,'fr')).map(i=>`| ${i.nom}${i.surgele?' ❄':''} | ${i.qte}${i.entame?' (entamé)':''} | ${i.unite||''} | ${i.obj||''} | ${i.dlc||''} | ${i.mange?'mangé':i.aAcheter?'à acheter':i.enStock?'en stock':''} |`).join('\n')+'\n'});
  F['Cuisine/Stock.md']=md;
  F['Cuisine/Courses.md']='---\ntags: [cuisine, courses]\nmaj: '+todayISO()+'\n---\n# Liste de courses\n\n'+(S.stock.filter(i=>i.aAcheter).map(i=>`- [ ] ${i.aqte||1} × ${i.nom} (${catLabel(i)})`).join('\n')||'Liste vide')+`\n\nTotal : ${listTotal().toFixed(2)} €\n`;
  [...new Set([...S.achats.map(a=>a.mois),cur])].forEach(m=>{const t=monthTotals(m);F[`Cuisine/Budget/${m}.md`]=`---\ntags: [cuisine, budget]\nmois: ${m}\n---\n# Budget ${monthLabel(m)}\n\nBudget : ${S.config.budget} €\nDépensé : ${t.total.toFixed(2)} €\n\n## Par catégorie\n${Object.entries(t.parCat).map(([c,v])=>`- ${c} : ${v.toFixed(2)} €`).join('\n')||'- aucune dépense'}\n\n## Achats\n${t.L.map(a=>`- ${a.date} · ${a.produit} · ${a.montant.toFixed(2)} €`).join('\n')||'- aucun'}\n`});
  S.recettes.forEach(r=>{F[`Cuisine/Recettes/${slug(r.titre)||r.id}.md`]=`---\ntags: [cuisine, recette${r.type==='repas'?', repas-sur-le-vif':''}]\ncategorie: ${r.cat||''}\nportions: ${r.portions||4}\nfavori: ${!!r.fav}\nsource: ${r.source||''}\n---\n# ${r.titre}\n\nPrépa ${r.prep||0} min · cuisson ${r.cuis||0} min · pour ${r.portions||4}\n\n## Ingrédients\n${(r.ings||[]).map(i=>'- '+ingLine(i)).join('\n')}\n\n## Étapes\n${(r.etapes||[]).map((e,n)=>`${n+1}. ${e}`).join('\n')}\n\n${r.notes?'## Notes\n'+r.notes+'\n':''}`});
  S.levains.forEach(l=>{F[`Cuisine/Levains/${slug(l.nom)||l.id}.md`]=`---\ntags: [cuisine, levain]\nne: ${l.ne||''}\nhydratation: ${l.hydra||100}\nfrequence-jours: ${l.freq||7}\n---\n# ${l.nom}\n\n${l.notes||''}\n\n## Journal\n\n| Quand | Quoi | Farine | Eau | Gardé | Montée | Odeur | Notes |\n|---|---|---|---|---|---|---|---|\n`+S.journal.filter(j=>j.levain===l.id).sort((a,b)=>b.quand.localeCompare(a.quand)).map(j=>`| ${j.quand.replace('T',' ')} | ${j.type} | ${j.farine||''} | ${j.eau||''} | ${j.garde||''} | ${j.montee||''} | ${j.odeur||''} | ${(j.notes||'').replace(/\|/g,'/')} |`).join('\n')+'\n'});
  return F;
}
async function offer(name,data){
  if(!window.claude){const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},1500);toast('Fichier prêt');return}
  try{const d=await window.claude.use('downloads');if(!d)throw 0;await d.save({filename:name,data});toast('Fichier prêt')}
  catch(e){toast(e&&e.code==='declined'?'Export annulé':'Le téléchargement n’est pas disponible ici.')}
}
async function exportMd(){
  const F=buildFiles();
  if(window.JSZip){const z=new JSZip();Object.entries(F).forEach(([p,c])=>z.file(p,c));const blob=await z.generateAsync({type:'blob'});offer('Notre-cuisine-'+todayISO()+'.zip',blob)}
  else offer('Notre-cuisine-'+todayISO()+'.md',Object.entries(F).map(([p,c])=>'<!-- '+p+' -->\n'+c).join('\n\n'));
}
function exportJson(){offer('notre-cuisine-'+todayISO()+'.json',JSON.stringify({stock:S.stock,achats:S.achats,recettes:S.recettes,levains:S.levains,journal:S.journal,imports:S.imports,archives:S.archives,menus:S.menus,config:S.config},null,1))}
